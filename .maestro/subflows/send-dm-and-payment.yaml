# Assert the DM and payment request created on the add-contact deep link.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: threadScreen
    timeout: 15000
- extendedWaitUntil:
    visible: ${DM_BODY}
    timeout: 180000
- extendedWaitUntil:
    visible:
      id: paymentRequestAmount
    timeout: 180000
- assertVisible:
    id: paymentRequestBubble
- assertVisible:
    id: paymentRequestAmount
- assertVisible: ${PAYMENT_AMOUNT} BTC
