appId: org.name.hypercolor
---
- extendedWaitUntil:
    visible:
      id: threadComposer
    timeout: 15000
- tapOn:
    id: threadComposer
- inputText: ${DM_BODY}
- hideKeyboard
- tapOn:
    id: threadSend
- extendedWaitUntil:
    visible: ${DM_BODY}
    timeout: 180000
- tapOn:
    id: threadRequestPay
- extendedWaitUntil:
    visible:
      id: paymentComposeSheet
    timeout: 15000
- tapOn:
    id: paymentComposeAmount
- eraseText
- inputText: ${PAYMENT_AMOUNT}
- hideKeyboard
- tapOn:
    id: paymentComposeSubmit
- extendedWaitUntil:
    visible:
      id: paymentRequestAmount
    timeout: 180000
- assertVisible:
    id: paymentRequestBubble
- assertVisible:
    id: paymentRequestAmount
- assertVisible: ${PAYMENT_AMOUNT} BTC
