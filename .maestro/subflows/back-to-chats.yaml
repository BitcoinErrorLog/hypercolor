# Leave ThreadScreen (and any request screen under it) and land on Chats.
# Sidecar/deep-link openThread pushes Thread on top of whatever was showing
# (Profile after a switch, Message requests after accept). Message requests
# uses messageRequestsBack, not threadBack, and has no tab bar.
# The tab-bar wait is generous on purpose: this subflow runs right after a
# send, so the JS thread is still finishing homeserver writes and the driver
# can need well over 15s to report the tab bar on a loaded emulator
# (2026-08-31_212405 recorded tabChats present, clickable and on screen while
# a 15s wait expired).
appId: ${APP_ID}
---
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            visible:
              id: threadBack
          commands:
            - tapOn:
                id: threadBack
      - runFlow:
          when:
            visible:
              id: messageRequestsBack
          commands:
            - tapOn:
                id: messageRequestsBack
- extendedWaitUntil:
    visible:
      id: tabChats
    timeout: 120000
- tapOn:
    id: tabChats
- extendedWaitUntil:
    visible:
      id: chatsScreen
    timeout: 120000
