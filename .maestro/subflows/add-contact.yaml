# Add SLOT as a contact. Optional DM_BODY / PAYMENT_AMOUNT run on the same
# deep link so iOS does not have to deliver a second openLink (it often drops it).
appId: ${APP_ID}
---
- openLink: hypercolor://e2e/add-contact?p=${SLOT}_${DM_BODY}_${PAYMENT_AMOUNT}
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Open
- runFlow:
    when:
      visible: OK
    commands:
      - tapOn: OK
- extendedWaitUntil:
    visible:
      id: threadScreen
    timeout: 180000
