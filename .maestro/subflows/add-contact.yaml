# APP_ID from env. iOS default org.name.hypercolor (.maestro/config.yaml). Android: com.hypercolor.
appId: ${APP_ID}
---
- tapOn:
    id: tabChats
- tapOn:
    id: chatsNew
- tapOn:
    id: contactSearchInput
- eraseText
- inputText: ${PEER_PUBKY}
- hideKeyboard
- tapOn:
    id: contactSearchAdd
- tapOn: Chat
- extendedWaitUntil:
    visible:
      id: threadScreen
    timeout: 60000
