# Sign in a previously captured identity secret on the Profile debug panel.
# Requires HOMESERVER_PUBKY and SECRET.
appId: ${APP_ID}
---
- scrollUntilVisible:
    element:
      id: debugSignupSecret
    direction: DOWN
    timeout: 15000
- tapOn:
    id: debugSignupSecret
- eraseText: 80
- inputText: ${SECRET}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: debugSignupSubmit
    direction: DOWN
    timeout: 10000
- tapOn:
    id: debugSignupSubmit
- extendedWaitUntil:
    visible:
      id: debugSignupContinue
    timeout: 120000
- copyTextFrom:
    id: debugSignupPubky
- evalScript: ${output.pubky = maestro.copiedText}
- copyTextFrom:
    id: debugSignupSecretValue
- evalScript: ${output.secret = maestro.copiedText}
- tapOn:
    id: debugSignupContinue
