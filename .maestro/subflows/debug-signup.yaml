# Fresh staging signup. Requires HOMESERVER_PUBKY, SIGNUP_TOKEN, SLOT.
appId: ${APP_ID}
---
# Single `p` query so Android `am start -d` does not truncate at `&`.
- openLink: hypercolor://e2e/debug-signup?p=${HOMESERVER_PUBKY}_${SIGNUP_TOKEN}_${SLOT}
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Open
- runFlow:
    when:
      visible: OK
    commands:
      - tapOn: OK
- extendedWaitUntil:
    visible:
      id: debugSignupContinue
    timeout: 120000
- copyTextFrom:
    id: debugSignupPubky
- evalScript: ${output.pubky = maestro.copiedText}
- copyTextFrom:
    id: debugSignupSecretValue
- evalScript: ${output.secret = maestro.copiedText}
- tapOn:
    id: debugSignupContinue
