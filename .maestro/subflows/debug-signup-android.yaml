# Android: seed debug signup through the HC_E2E file sidecar.
# Maestro 2.9 inputText/eraseText hangs the driver (DEADLINE_EXCEEDED).
appId: ${APP_ID}
---
- runScript:
    file: ../scripts/androidE2eCmd.js
    env:
      E2E_URL: hypercolor://e2e/debug-signup?p=${HOMESERVER_PUBKY}_${SIGNUP_TOKEN}_${SLOT}
- extendedWaitUntil:
    visible:
      id: debugSignupContinue
    timeout: 180000
- copyTextFrom:
    id: debugSignupPubky
- evalScript: ${output.pubky = maestro.copiedText}
- copyTextFrom:
    id: debugSignupSecretValue
- evalScript: ${output.secret = maestro.copiedText}
- tapOn:
    id: debugSignupContinue
