# Send a DM and a payment request from the real Thread composer.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible:
      id: threadComposer
    timeout: 15000
- tapOn:
    id: threadComposer
- inputText: ${DM_BODY}
- hideKeyboard
- tapOn:
    id: threadSend
- extendedWaitUntil:
    visible: ${DM_BODY}
    timeout: 180000
- tapOn:
    id: threadRequestPay
- extendedWaitUntil:
    visible:
      id: paymentComposeSheet
    timeout: 15000
- tapOn:
    id: paymentComposeReference
- inputText: p7-maestro-ref
- tapOn: Send request
- extendedWaitUntil:
    visible:
      id: paymentRequestBubble
    timeout: 180000
- assertVisible:
    id: paymentRequestAmount
- assertVisible: ${PAYMENT_AMOUNT} BTC
