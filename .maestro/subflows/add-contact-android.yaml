# Add PEER_PUBKY via the e2e file sidecar (same handler as iOS openLink).
# Optional DM_BODY is sent before the thread is opened so ThreadScreen's
# first load includes the message (re-open of an already-focused thread
# does not refetch).
appId: ${APP_ID}
---
- runScript:
    file: ../scripts/androidE2eCmd.js
    env:
      E2E_URL: 'hypercolor://e2e/add-contact?peer=${PEER_PUBKY}&body=${DM_BODY}'
- extendedWaitUntil:
    visible:
      id: threadScreen
    timeout: 180000
