# APP_ID from env. iOS default org.name.hypercolor (.maestro/config.yaml) so
# `maestro test` works on the iOS sim without extra env. Android: com.hypercolor.
# iOS 18 cannot type RN TextInputs — keep hypercolor://e2e/* there.
# Android Maestro openLink VIEW is not delivered on this singleTask activity,
# so Android uses the product Debug signup panel and Find Contact screen.
appId: ${APP_ID}
name: P7 product screens
---
- launchApp:
    clearState: true
# iOS: welcomeScreen testID is visible.
# Android: Maestro clearState+launch can leave the launcher in front
# (2026-08-31_131744). A second launch without clear brings the activity
# up. Then wait on the Connect button text — Maestro 2.9 treats the
# full-screen welcomeScreen ViewGroup as not visible even when
# resource-id welcomeScreen is in the hierarchy (2026-08-31_131201).
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: welcomeScreen
          timeout: 60000
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          clearState: false
      - extendedWaitUntil:
          visible: Connect with pubky-ring
          timeout: 120000

# Party A: debug signup + enable messaging (receiver marker, no Ring).
- runFlow:
    when:
      platform: iOS
    file: subflows/debug-signup.yaml
    env:
      SIGNUP_TOKEN: ${SIGNUP_TOKEN_A}
      SLOT: A
- runFlow:
    when:
      platform: Android
    file: subflows/debug-signup-android.yaml
    env:
      SIGNUP_TOKEN: ${SIGNUP_TOKEN_A}
      SLOT: A
- evalScript: ${output.secretA = output.secret}
- evalScript: ${output.pubkyA = output.pubky}
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: chatsScreen
          timeout: 30000
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            id: chatsNew
          timeout: 60000
- runFlow:
    file: subflows/enable-messaging.yaml

# Party B: switch on Profile without product sign-out (keeps A's homeserver marker).
- tapOn:
    id: tabProfile
- runFlow:
    when:
      platform: iOS
    file: subflows/debug-signup.yaml
    env:
      SIGNUP_TOKEN: ${SIGNUP_TOKEN_B}
      SLOT: B
- runFlow:
    when:
      platform: Android
    file: subflows/debug-signup-android.yaml
    env:
      SIGNUP_TOKEN: ${SIGNUP_TOKEN_B}
      SLOT: B
- evalScript: ${output.secretB = output.secret}
- evalScript: ${output.pubkyB = output.pubky}
- runFlow:
    file: subflows/enable-messaging.yaml

# A adds B and sends a starter DM so B gets a pending message request.
- tapOn:
    id: tabProfile
- runFlow:
    when:
      platform: iOS
    file: subflows/switch-account.yaml
    env:
      SLOT: A
- runFlow:
    when:
      platform: Android
    file: subflows/switch-account-android-a.yaml
- runFlow:
    when:
      platform: iOS
    file: subflows/add-contact.yaml
    env:
      SLOT: B
      DM_BODY: ""
      PAYMENT_AMOUNT: ""
- runFlow:
    when:
      platform: Android
    file: subflows/add-contact-android.yaml
    env:
      PEER_PUBKY: ${output.pubkyB}
      DM_BODY: ${STARTER_BODY}
- runFlow:
    when:
      platform: iOS
    file: subflows/send-starter-dm.yaml
- runFlow:
    when:
      platform: Android
    file: subflows/send-starter-dm-android.yaml
    env:
      PEER_PUBKY: ${output.pubkyB}
- runFlow:
    file: subflows/back-to-chats.yaml

# B accepts A's request on the product Message requests screen.
- tapOn:
    id: tabProfile
- runFlow:
    when:
      platform: iOS
    file: subflows/switch-account.yaml
    env:
      SLOT: B
- runFlow:
    when:
      platform: Android
    file: subflows/switch-account-android-b.yaml
# B adds A so inbox sync includes A (Links cannot probe unknown peers).
- runFlow:
    when:
      platform: iOS
    file: subflows/add-contact.yaml
    env:
      SLOT: A
      DM_BODY: ""
      PAYMENT_AMOUNT: ""
- runFlow:
    when:
      platform: Android
    file: subflows/add-contact-android.yaml
    env:
      PEER_PUBKY: ${output.pubkyA}
      DM_BODY: ""
- runFlow:
    file: subflows/back-to-chats.yaml
- runFlow:
    file: subflows/accept-message-request.yaml

# B sends a DM and a payment request on ThreadScreen.
- runFlow:
    when:
      platform: iOS
    file: subflows/send-dm-and-payment.yaml
    env:
      SLOT: A
- runFlow:
    when:
      platform: Android
    file: subflows/send-dm-and-payment-android.yaml
    env:
      PEER_PUBKY: ${output.pubkyA}

# B's sends are queued, not delivered: B answered A with Noise message 2 and is
# still `handshaking`. Only A can write message 3, and only B can read it, so on
# a single device — where exactly one session is active at a time — each party
# needs its own foreground turn. Give A one so it writes message 3, then give B
# one so it reads it, reaches `established`, and drains its own outbox. Neither
# side ever touches the other's handshake handle; two devices reach the same
# sequence through their own foreground ticks.
- runFlow:
    file: subflows/back-to-chats.yaml
- tapOn:
    id: tabProfile
- runFlow:
    when:
      platform: iOS
    file: subflows/switch-account.yaml
    env:
      SLOT: A
- runFlow:
    when:
      platform: Android
    file: subflows/switch-account-android-a.yaml
- runFlow:
    file: subflows/back-to-chats.yaml
- tapOn:
    id: tabProfile
- runFlow:
    when:
      platform: iOS
    file: subflows/switch-account.yaml
    env:
      SLOT: B
      THEN_THREAD_SLOT: A
- runFlow:
    when:
      platform: Android
    file: subflows/switch-account-android-b.yaml
- runFlow:
    when:
      platform: Android
    file: subflows/wait-outbound-sent-android.yaml
    env:
      PEER_PUBKY: ${output.pubkyA}
- extendedWaitUntil:
    visible: sent
    timeout: 120000

# A receives the DM and the payment-request bubble on the real thread.
- runFlow:
    file: subflows/back-to-chats.yaml
- tapOn:
    id: tabProfile
- runFlow:
    when:
      platform: iOS
    file: subflows/switch-account.yaml
    env:
      SLOT: A
      THEN_THREAD_SLOT: B
- runFlow:
    when:
      platform: Android
    file: subflows/switch-account-android-a.yaml
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: tabChats
      - extendedWaitUntil:
          visible:
            id: chatRow
          timeout: 180000
      - tapOn:
          id: chatRow
- extendedWaitUntil:
    visible:
      id: threadScreen
    timeout: 30000
- runFlow:
    when:
      platform: Android
    file: subflows/wait-inbound-dm-android.yaml
    env:
      PEER_PUBKY: ${output.pubkyB}
- extendedWaitUntil:
    visible: ${DM_BODY}
    timeout: 180000
- assertVisible:
    id: paymentRequestBubble
- assertVisible:
    id: paymentRequestAmount
- assertVisible: ${PAYMENT_AMOUNT} BTC
