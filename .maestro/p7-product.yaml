# APP_ID from env. iOS default org.name.hypercolor (.maestro/config.yaml) so
# `maestro test` works on the iOS sim without extra env. Android: com.hypercolor.
appId: ${APP_ID}
name: P7 product screens
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: welcomeScreen
    timeout: 60000

# Party A: debug signup + enable messaging (receiver marker, no Ring).
- runFlow:
    file: subflows/debug-signup.yaml
    env:
      SIGNUP_TOKEN: ${SIGNUP_TOKEN_A}
      SLOT: A
- evalScript: ${output.secretA = output.secret}
- evalScript: ${output.pubkyA = output.pubky}
- extendedWaitUntil:
    visible:
      id: chatsScreen
    timeout: 30000
- runFlow:
    file: subflows/enable-messaging.yaml

# Party B: switch on Profile without product sign-out (keeps A's homeserver marker).
- tapOn:
    id: tabProfile
- runFlow:
    file: subflows/debug-signup.yaml
    env:
      SIGNUP_TOKEN: ${SIGNUP_TOKEN_B}
      SLOT: B
- evalScript: ${output.secretB = output.secret}
- evalScript: ${output.pubkyB = output.pubky}
- runFlow:
    file: subflows/enable-messaging.yaml

# A adds B so B's inbound DM auto-accepts on the product WoT gate.
- tapOn:
    id: tabProfile
- runFlow:
    file: subflows/switch-account.yaml
    env:
      SLOT: A
- runFlow:
    file: subflows/add-contact.yaml
    env:
      SLOT: B
      DM_BODY: ""
      PAYMENT_AMOUNT: ""
- tapOn:
    id: threadBack

# B sends a DM and a payment request on ThreadScreen.
- tapOn:
    id: tabProfile
- runFlow:
    file: subflows/switch-account.yaml
    env:
      SLOT: B
- runFlow:
    file: subflows/add-contact.yaml
    env:
      SLOT: A
      DM_BODY: ${DM_BODY}
      PAYMENT_AMOUNT: ${PAYMENT_AMOUNT}
- runFlow:
    file: subflows/send-dm-and-payment.yaml
    env:
      SLOT: A

# A receives the DM and the payment-request bubble on the real thread.
- tapOn:
    id: threadBack
- tapOn:
    id: tabProfile
- runFlow:
    file: subflows/switch-account.yaml
    env:
      SLOT: A
      THEN_THREAD_SLOT: B
- extendedWaitUntil:
    visible:
      id: threadScreen
    timeout: 30000
- extendedWaitUntil:
    visible: ${DM_BODY}
    timeout: 180000
- assertVisible:
    id: paymentRequestBubble
- assertVisible:
    id: paymentRequestAmount
- assertVisible: ${PAYMENT_AMOUNT} BTC
